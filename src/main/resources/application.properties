quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql
# Mostra o HQL/SQL gerado a partir do filtro
quarkus.hibernate-orm.log.sql=true

# Limites do quarkus-rsql (valores padrão)
quarkus.rsql.max-filter-length=2048
quarkus.rsql.max-comparisons=64
quarkus.rsql.max-in-values=256
quarkus.rsql.max-depth=32
