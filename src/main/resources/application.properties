quarkus.datasource.db-kind=postgresql

# quarkus:dev and the jar use the PostgreSQL of compose.yaml (docker compose up -d)
%dev,prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/demo
%dev,prod.quarkus.datasource.username=demo
%dev,prod.quarkus.datasource.password=demo

# The tests start their own PostgreSQL 17 (Dev Services / Testcontainers)
%test.quarkus.datasource.devservices.image-name=postgres:17

quarkus.hibernate-orm.schema-management.strategy=drop-and-create
# import.sql: fixed data used by the tests; bulk.sql: 200,000 fruits to measure performance
quarkus.hibernate-orm.sql-load-script=import.sql
%dev,prod.quarkus.hibernate-orm.sql-load-script=import.sql,bulk.sql

# Logs the SQL generated from the filter
%dev.quarkus.hibernate-orm.log.sql=true

# quarkus-rsql limits (default values)
quarkus.rsql.max-filter-length=2048
quarkus.rsql.max-comparisons=64
quarkus.rsql.max-in-values=256
quarkus.rsql.max-depth=32
